# Deployed as the Dokploy Compose service "logging" (project "Internship 2026", environment "shared").
# Source: this file in GitHub (ops, main). A push that changes logging/** redeploys it automatically,
# so never edit the compose in the Dokploy UI. Secrets (GRAFANA_*) live in the Dokploy Environment.

services:
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    environment:
      GOMEMLIMIT: 200MiB
    configs:
      - source: loki-config
        target: /etc/loki/config.yaml
    volumes:
      - loki-data:/loki
    networks: [logging]
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
      - --query.max-samples=5000000
    environment:
      GOMEMLIMIT: 200MiB
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    networks: [logging]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:12.4.14
    restart: unless-stopped
    depends_on:
      loki: { condition: service_started }
      prometheus: { condition: service_healthy }
    environment:
      GF_SERVER_ROOT_URL: https://logs.wallet.shatori.com
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the Dokploy environment}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      # Email for invites and "Forgot password", sent through Resend SMTP.
      # The Resend login is always "resend"; the password is an API key (Sending access, wallet.shatori.com).
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: smtp.resend.com:587
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:?set GRAFANA_SMTP_PASSWORD in the Dokploy environment}
      GF_SMTP_FROM_ADDRESS: grafana@wallet.shatori.com
      GF_SMTP_FROM_NAME: Wallet Logs
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/logs.json
      # Keep the footprint small: no bundled plugin downloads, no background update checks.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GOMEMLIMIT: 150MiB
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/internship.yaml
      - source: grafana-dashboard-logs
        target: /etc/grafana/dashboards/logs.json
      - source: grafana-dashboard-server
        target: /etc/grafana/dashboards/server.json
      - source: grafana-dashboard-services
        target: /etc/grafana/dashboards/services.json
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [logging]
    deploy:
      resources:
        limits:
          memory: 256M

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    depends_on: [loki]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      GOMEMLIMIT: 100MiB
    configs:
      - source: alloy-logs-config
        target: /etc/alloy/config.alloy
    volumes:
      # `:ro` protects the socket file, not the Docker API: whoever runs code in this container could control Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [logging]
    deploy:
      resources:
        limits:
          memory: 128M

  alloy-metrics:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      GOMEMLIMIT: 150MiB
    configs:
      - source: alloy-metrics-config
        target: /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - alloy-metrics-data:/var/lib/alloy/data
    networks: [logging, dokploy-network]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3 && grep -q "Alloy is ready" <&3'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192M

  # Alloy has no Docker events source. The name filter runs here, so other projects' container names never reach
  # even this container's log (BusyBox grep has no --line-buffered, hence awk with fflush).
  docker-events:
    image: docker:28.5.2-cli
    restart: unless-stopped
    entrypoint: ['sh', '-c']
    command:
      - >-
        docker events --filter type=container --filter event=die --filter event=oom
        --format '{"action":{{json .Action}},"container":{{json .Actor.Attributes.name}},"exitCode":{{json (index .Actor.Attributes "exitCode")}}}'
        | awk '/"container":"(internship-(redis|mysql)-[a-z0-9]{6}|(staging|kvitka-uat|wisla-uat)-(wallet-core|rates-service|treasury-service)-[a-z0-9]+)\./ { print; fflush() }'
    environment:
      GOMEMLIMIT: 24MiB
    # alloy keeps only the container with this label: a generic compose service name could match another project's.
    labels:
      wallet.logging.role: docker-events
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [logging]
    deploy:
      resources:
        limits:
          memory: 32M

# Loki is reachable only on this internal network (Grafana is also attached to dokploy-network by Dokploy).
networks:
  logging: {}
  dokploy-network:
    external: true

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
  alloy-data:
  alloy-metrics-data:

configs:
  loki-config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
        grpc_listen_port: 9096
        log_level: warn
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
      schema_config:
        configs:
          - from: 2026-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 336h # 14 days
        allow_structured_metadata: true
        volume_enabled: true
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 8
      compactor:
        working_directory: /loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem
      query_range:
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_mb: 32
      pattern_ingester:
        enabled: false
      analytics:
        reporting_enabled: false

  prometheus-config:
    content: |
      global: {}

  alloy-logs-config:
    file: ./alloy/logs.alloy

  alloy-metrics-config:
    file: ./alloy/metrics.alloy

  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          editable: false
          jsonData:
            maxLines: 2000
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: false
          editable: false
          jsonData:
            timeInterval: 15s

  grafana-dashboard-provider:
    content: |
      apiVersion: 1
      providers:
        - name: internship
          folder: Internship
          type: file
          disableDeletion: true
          allowUiUpdates: false
          options:
            path: /etc/grafana/dashboards

  grafana-dashboard-logs:
    file: ./grafana/dashboards/logs.json

  grafana-dashboard-server:
    file: ./grafana/dashboards/server.json

  grafana-dashboard-services:
    file: ./grafana/dashboards/services.json
