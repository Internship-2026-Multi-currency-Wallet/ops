# Local development stack for the wallet.
#
# Expects all repositories cloned side by side:
#   wallet-core/  rates-service/  treasury-service/  client-web/  back-office/  ops/
#
# Use ./dev.sh instead of calling docker compose directly:
#   ./dev.sh up                        # infrastructure only: MySQL + Redis + Mailpit
#   ./dev.sh up rates-service          # infrastructure + rates-service in a container
#   ./dev.sh up all                    # everything
#
# Infrastructure (mysql, redis, mailpit) has no profile and always starts. Every application service is opt-in:
# it has a profile named after itself plus the profile "all".
#
# Networking:
#   - containers reach the infrastructure by service name (mysql:3306, redis:6379, mailpit:1025);
#   - containers reach the other backends via host.docker.internal:<host port>, which works both when the
#     other backend runs in a container (published port) and when it runs on the host (npm run start:dev);
#   - services running on the host reach everything via localhost:<host port>.
#
# PayGate is not part of this stack: it is an external sandbox (see README).

name: wallet

x-backend-env: &backend-env
  NODE_ENV: production
  # Environment name: prefixes Redis keys; DEV_AUTH is refused for *-uat.
  APP_ENV: ${APP_ENV:-local}
  REDIS_URL: redis://redis:6379
  CLIENT: ${CLIENT:-demo}
  DEV_AUTH: ${DEV_AUTH:-true}
  JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-not-for-servers-01}
  CORS_ORIGINS: http://localhost:${CLIENT_WEB_PORT:-8080},http://localhost:${BACK_OFFICE_PORT:-8081},http://localhost:5173,http://localhost:5174
  # Base URLs of the other backends (container or host process alike, see the header).
  WALLET_CORE_URL: http://host.docker.internal:${WALLET_CORE_PORT:-3000}
  RATES_SERVICE_URL: http://host.docker.internal:${RATES_SERVICE_PORT:-3001}
  TREASURY_SERVICE_URL: http://host.docker.internal:${TREASURY_SERVICE_PORT:-3002}

# Common settings of the three backends.
x-backend: &backend
  # host.docker.internal is built into Docker Desktop and Colima; this mapping adds it on Linux.
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-wallet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wallet}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  wallet-core:
    <<: *backend
    profiles: [wallet-core, all]
    build: ../wallet-core
    # Apply pending migrations, then start the service.
    command: sh -c "npm run migrate && node dist/main.js"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    environment:
      <<: *backend-env
      PORT: 3000
      EMAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      BACKOFFICE_URL: ${BACKOFFICE_URL:-http://back-office.local.test}
      # Empty = Google login not configured (wallet-core treats an empty value as not set).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DATABASE_URL: mysql://${MYSQL_USER:-wallet}:${MYSQL_PASSWORD:-wallet}@mysql:3306/wallet_core
    ports:
      - '${WALLET_CORE_PORT:-3000}:3000'

  rates-service:
    <<: *backend
    profiles: [rates-service, all]
    build: ../rates-service
    command: sh -c "npm run migrate && node dist/main.js"
    environment:
      <<: *backend-env
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-wallet}:${MYSQL_PASSWORD:-wallet}@mysql:3306/rates_service
    ports:
      - '${RATES_SERVICE_PORT:-3001}:3000'

  treasury-service:
    <<: *backend
    profiles: [treasury-service, all]
    build: ../treasury-service
    command: sh -c "npm run migrate && node dist/main.js"
    environment:
      <<: *backend-env
      PORT: 3000
      ROLE: GATEWAY,WORKER
      DATABASE_URL: mysql://${MYSQL_USER:-wallet}:${MYSQL_PASSWORD:-wallet}@mysql:3306/treasury_service
    ports:
      - '${TREASURY_SERVICE_PORT:-3002}:3000'

  client-web:
    profiles: [client-web, all]
    build:
      context: ../client-web
      args:
        # The browser calls the backends directly, so these are host URLs.
        VITE_WALLET_CORE_URL: http://localhost:${WALLET_CORE_PORT:-3000}/graphql
        VITE_RATES_SERVICE_URL: http://localhost:${RATES_SERVICE_PORT:-3001}/graphql
        VITE_RATES_SERVICE_WS_URL: ws://localhost:${RATES_SERVICE_PORT:-3001}/graphql
        VITE_CLIENT: ${CLIENT:-demo}
        VITE_DEV_USER: ${CLIENT_WEB_DEV_USER:-1:wallet}
        VITE_USE_MOCKS: 'false'
        # Public Client ID only; the secret must never reach a frontend build.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    # No depends_on: the browser calls the backends on localhost, wherever they run.
    ports:
      - '${CLIENT_WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 10

  back-office:
    profiles: [back-office, all]
    build:
      context: ../back-office
      args:
        VITE_WALLET_CORE_URL: http://localhost:${WALLET_CORE_PORT:-3000}/graphql
        VITE_RATES_SERVICE_URL: http://localhost:${RATES_SERVICE_PORT:-3001}/graphql
        VITE_RATES_SERVICE_WS_URL: ws://localhost:${RATES_SERVICE_PORT:-3001}/graphql
        VITE_TREASURY_SERVICE_URL: http://localhost:${TREASURY_SERVICE_PORT:-3002}/graphql
        VITE_TREASURY_SERVICE_WS_URL: ws://localhost:${TREASURY_SERVICE_PORT:-3002}/graphql
        VITE_CLIENT: ${CLIENT:-demo}
        VITE_DEV_USER: ${BACK_OFFICE_DEV_USER:-100:bo:users,bo:users:modify}
        VITE_USE_MOCKS: 'false'
    ports:
      - '${BACK_OFFICE_PORT:-8081}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
