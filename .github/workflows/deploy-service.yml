# Reusable deploy workflow for container services (backends, PayGate) → GHCR → Dokploy.
#
# Called by a thin workflow in each service repository on push to main / client/<c>-uat:
#
#   jobs:
#     deploy:
#       uses: Internship-2026-Multi-currency-Wallet/ops/.github/workflows/deploy-service.yml@main
#       with:
#         subdomain: rates            # → https://<env>-rates.wallet.shatori.com/health
#       secrets: inherit
#
# Steps: resolve the environment from the branch → build the image → push it to GHCR as
# <env>-<sha> and <env>-latest → point the Dokploy application at <env>-<sha> and redeploy it →
# wait until the health endpoint reports the new version.
#
# Dokploy layout (looked up by name, no ids in Git): project "Internship 2026" → environment named
# like APP_ENV (staging, kvitka-uat, wisla-uat) → application named like the repository.
#
# Secrets (repository or organization): DOKPLOY_URL, DOKPLOY_TOKEN.

name: Deploy service

on:
  workflow_call:
    inputs:
      service:
        description: Image and Dokploy application name (default = repository name)
        type: string
        default: ''
      subdomain:
        description: Host is <env>-<subdomain>.<base-domain>; empty when health-url is given
        type: string
        default: ''
      base-domain:
        type: string
        default: wallet.shatori.com
      environment:
        description: Fixed environment instead of the one resolved from the branch (e.g. "shared")
        type: string
        default: ''
      health-url:
        description: Health URL to poll instead of https://<env>-<subdomain>.<base-domain>/health
        type: string
        default: ''
      check-version:
        description: Require the health JSON field "version" to equal the commit SHA
        type: boolean
        default: true
      private-image:
        description: >-
          Deprecated, ignored. Private GHCR packages (e.g. paygate) are pulled with the long-lived
          "ghcr" registry configured in Dokploy (Settings → Registry), not with a CI token.
        type: boolean
        default: false
    secrets:
      DOKPLOY_URL:
        required: true
      DOKPLOY_TOKEN:
        required: true

env:
  DOKPLOY_PROJECT: Internship 2026

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve environment
        id: env
        env:
          BRANCH: ${{ github.ref_name }}
          FIXED_ENV: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service || github.event.repository.name }}
          SUBDOMAIN: ${{ inputs.subdomain }}
          BASE_DOMAIN: ${{ inputs.base-domain }}
          HEALTH_URL: ${{ inputs.health-url }}
        run: |
          if [ -n "$FIXED_ENV" ]; then
            env="$FIXED_ENV"
          else
            case "$BRANCH" in
              main) env=staging ;;
              client/*-uat) env="${BRANCH#client/}" ;;
              *) echo "::error::Branch '$BRANCH' is not deployed (main → staging, client/<c>-uat → <c>-uat)"; exit 1 ;;
            esac
          fi
          if [ -z "$HEALTH_URL" ]; then
            [ -n "$SUBDOMAIN" ] || { echo "::error::Set either subdomain or health-url"; exit 1; }
            HEALTH_URL="https://${env}-${SUBDOMAIN}.${BASE_DOMAIN}/health"
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${SERVICE}"
          {
            echo "env=$env"
            echo "service=$SERVICE"
            echo "image=$image"
            echo "tag=${env}-${GITHUB_SHA}"
            echo "health_url=$HEALTH_URL"
          } >> "$GITHUB_OUTPUT"
          echo "### Deploy \`$SERVICE\` → \`$env\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image \`$image:${env}-${GITHUB_SHA}\`, health $HEALTH_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.env.outputs.image }}:${{ steps.env.outputs.tag }}
            ${{ steps.env.outputs.image }}:${{ steps.env.outputs.env }}-latest
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.env.outputs.service }}
          cache-to: type=gha,mode=max,scope=${{ steps.env.outputs.service }}

      - name: Redeploy the Dokploy application
        id: dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          ENV_NAME: ${{ steps.env.outputs.env }}
          SERVICE: ${{ steps.env.outputs.service }}
          IMAGE: ${{ steps.env.outputs.image }}:${{ steps.env.outputs.tag }}
        run: |
          set -euo pipefail
          api() { # api GET|POST <endpoint> [query|json]
            if [ "$1" = GET ]; then
              curl -sSf "$DOKPLOY_URL/api/$2?$3" -H "x-api-key: $DOKPLOY_TOKEN"
            else
              curl -sSf -X POST "$DOKPLOY_URL/api/$2" -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' -d "$3"
            fi
          }
          # Only ids are extracted; nothing from the API response is printed.
          app_id="$(api GET project.all '' | jq -r --arg p "$DOKPLOY_PROJECT" --arg e "$ENV_NAME" --arg s "$SERVICE" '
            .[] | select(.name == $p) | .environments[] | select(.name == $e)
                | .applications[] | select(.name == $s) | .applicationId' | head -n 1)"
          if [ -z "$app_id" ]; then
            echo "::error::No Dokploy application '$SERVICE' in environment '$ENV_NAME' of project '$DOKPLOY_PROJECT'"
            exit 1
          fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

          # No credentials on the application: Docker inside the Dokploy container pulls public
          # packages anonymously and private ones (paygate) with the "ghcr" registry login configured
          # in Dokploy (Settings → Registry, a read:packages token). Never pass a short-lived CI token
          # here: Dokploy runs `docker login` with it, the login stays after the token expires, and
          # then every ghcr.io pull on the server fails with "denied".
          creds='{"username":null,"password":null,"registryUrl":null}'
          api POST application.saveDockerProvider "$(jq -nc --arg id "$app_id" --arg img "$IMAGE" --argjson c "$creds" \
            '{applicationId:$id, dockerImage:$img} + $c')" > /dev/null

          before="$(api GET deployment.all "applicationId=$app_id" | jq -c '[.[].deploymentId]')"
          api POST application.deploy "$(jq -nc --arg id "$app_id" --arg t "CI ${GITHUB_SHA::7}" \
            --arg d "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{applicationId:$id, title:$t, description:$d}')" > /dev/null
          echo "Deployment of $IMAGE queued"

          # Wait for the Dokploy deployment (pull + service update) to finish.
          for i in $(seq 1 60); do
            sleep 5
            status="$(api GET deployment.all "applicationId=$app_id" | jq -r --argjson b "$before" '
              [.[] | select(.deploymentId as $id | $b | index($id) | not)] | sort_by(.createdAt) | last | .status // "pending"')"
            echo "Dokploy deployment: $status"
            case "$status" in
              done) exit 0 ;;
              error) echo "::error::Dokploy deployment failed (see the deployment log in Dokploy)"; exit 1 ;;
            esac
          done
          echo "::error::Dokploy deployment did not finish in 5 minutes"
          exit 1

      - name: Wait until the new version is healthy
        env:
          HEALTH_URL: ${{ steps.env.outputs.health_url }}
          CHECK_VERSION: ${{ inputs.check-version }}
        run: |
          set +e -uo pipefail # keep polling when curl fails (bash -e is the default)
          for i in $(seq 1 60); do
            body="$(curl -sS --max-time 10 "$HEALTH_URL")"
            code=$?
            if [ $code -eq 0 ] && echo "$body" | jq -e '.status == "ok"' > /dev/null 2>&1; then
              if [ "$CHECK_VERSION" != true ] || echo "$body" | jq -e --arg v "$GITHUB_SHA" '.version == $v' > /dev/null; then
                echo "Healthy: $body"
                echo "Healthy: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "Waiting ($i): ${body:-no response}"
            sleep 5
          done
          echo "::error::$HEALTH_URL did not report a healthy new version within 5 minutes"
          exit 1

      # Dokploy reports a deployment as done once the swarm service is updated, not once the new
      # container is up: a container that crashes on start (e.g. a missing required env variable)
      # or never turns healthy leaves the previous version serving (or nothing, if it is gone).
      # Show what swarm did with the new version. Only selected fields are printed, never the
      # inspect dump: it contains the env (secrets).
      - name: Show why the new version is not running
        if: failure() && steps.dokploy.outputs.app_id != ''
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP_ID: ${{ steps.dokploy.outputs.app_id }}
          IMAGE: ${{ steps.env.outputs.image }}:${{ steps.env.outputs.tag }}
        run: |
          set +e -uo pipefail # best effort: the job has already failed
          api() { curl -sSf --max-time 30 "$DOKPLOY_URL/api/$1?$2" -H "x-api-key: $DOKPLOY_TOKEN"; }
          # Swarm task details (`docker service ps --format json`) are only exposed over tRPC.
          trpc() { curl -sSf --max-time 30 -G "$DOKPLOY_URL/api/trpc/$1" --data-urlencode "input=$2" \
            -H "x-api-key: $DOKPLOY_TOKEN" | jq '.result.data.json'; }

          app="$(api application.one "applicationId=$APP_ID")" \
            || { echo "::warning::Could not read the Dokploy application"; exit 0; }
          app_name="$(jq -r '.appName' <<< "$app")"
          server_id="$(jq -r '.serverId // empty' <<< "$app")"
          server_q="${server_id:+&serverId=$server_id}"
          echo "Expected image: $IMAGE"

          tasks="$(trpc swarm.getAppInfos "$(jq -nc --arg a "$app_name" --arg s "$server_id" \
            '{json: ({appName: [$a]} + (if $s == "" then {} else {serverId: $s} end))}')")"
          [ -n "$tasks" ] && [ "$tasks" != null ] \
            || { echo "::warning::Could not list the swarm tasks of $app_name"; tasks='[]'; }
          # Error comes JSON-quoted from docker; mark the tasks of the image this run deployed.
          tasks="$(jq --arg img "$IMAGE" 'map(.Error |= (ltrimstr("\"") | rtrimstr("\"")) | .new = (.Image == $img))' <<< "$tasks")"
          rows="$(jq -r '.[] | "\(if .new then "new" else "old" end)  \(.Name)  desired=\(.DesiredState)  \(.CurrentState)  \(.Error)\(if .new then "" else "  [\(.Image | sub(".*:"; ""))]" end)"' <<< "$tasks")"
          echo "::group::Swarm tasks of $app_name (newest first)"
          echo "$rows"
          echo "::endgroup::"

          # The newest containers of the service (docker ps -a lists the newest first).
          containers="$(api docker.getContainersByAppNameMatch "appName=$app_name$server_q" | jq -r '.[].containerId' | head -n 3)"
          for id in $containers; do
            echo "::group::Container $id"
            api docker.getConfig "containerId=$id$server_q" | jq -r '
              "image:    \(.Config.Image)",
              "state:    \(.State.Status), exit code \(.State.ExitCode), OOM killed \(.State.OOMKilled), health \(.State.Health.Status // "-")",
              "error:    \(if (.State.Error // "") == "" then "-" else .State.Error end)",
              "started:  \(.State.StartedAt), finished \(.State.FinishedAt)",
              (.State.Health.Log // [] | .[-3:][] | "health:   exit \(.ExitCode) \(.Output | gsub("\\s+$"; ""))")'
            echo "::endgroup::"
          done

          failed="$(jq '[.[] | select(.new and .Error != "")] | length' <<< "$tasks")"
          last_error="$(jq -r '[.[] | select(.new and .Error != "")][0].Error // empty' <<< "$tasks")"
          newest="$(jq -r '.[0] // empty | "\(.Image // "?" | sub(".*:"; "")) \(.CurrentState)"' <<< "$tasks")"
          if [ -n "$last_error" ]; then
            echo "::error title=New version of $app_name does not start::$failed task(s) of the new image failed: $last_error. Newest task: ${newest:-none}. Container logs: Dokploy → $app_name → Logs"
          else
            echo "::notice title=No failed task of the new image::Newest task: ${newest:-none}. Check the deployment and container logs of $app_name in Dokploy"
          fi
          {
            echo "#### Swarm tasks of \`$app_name\`"
            echo '```'
            echo "$rows"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
