# Manual helper: status of the Cloudflare Pages custom domains of every frontend and environment,
# and (optionally) re-create a domain that is stuck in "pending" (deletes and attaches it again).
# The deploy workflow (deploy-pages.yml) creates projects, domains and DNS records itself.
name: Pages domains

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: Host to detach and attach again (e.g. staging.wallet.shatori.com); empty = only show status
        type: string
        default: ''

permissions:
  contents: read

jobs:
  domains:
    runs-on: ubuntu-latest
    steps:
      - name: Show (and repair) custom domains
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECREATE: ${{ inputs.recreate }}
        run: |
          set -euo pipefail
          cf() { curl -sS "$@" -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json'; }
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          for app in client-web back-office; do
            for env in staging kvitka-uat wisla-uat; do
              project="$app-$env"
              if [ -n "$RECREATE" ]; then
                if cf "$base/$project/domains" | jq -e --arg h "$RECREATE" '.result[]? | select(.name == $h)' > /dev/null; then
                  cf -X DELETE "$base/$project/domains/$RECREATE" | jq -c '{success, errors}'
                  sleep 5
                  cf -X POST "$base/$project/domains" -d "$(jq -nc --arg n "$RECREATE" '{name:$n}')" | jq -c '{success, errors}'
                  echo "Re-created $RECREATE on $project"
                fi
              fi
              cf "$base/$project/domains" | jq -c --arg p "$project" '.result[]? |
                {project: $p, name, status, verification: .verification_data, validation: (.validation_data | {status, method, error_message})}'
            done
          done
