# Manual helper: status of the Cloudflare Pages custom domains of every frontend and environment,
# and (optionally) re-create a domain that is stuck in "pending" (deletes and attaches it again).
# The deploy workflow (deploy-pages.yml) creates projects, domains and DNS records itself.
name: Pages domains

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: Host to detach and attach again (e.g. staging.wallet.shatori.com); empty = only show status
        type: string
        default: ''
      proxied:
        description: Proxy the re-created DNS record through Cloudflare (orange cloud)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  domains:
    runs-on: ubuntu-latest
    steps:
      - name: Show (and repair) custom domains
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECREATE: ${{ inputs.recreate }}
          PROXIED: ${{ inputs.proxied }}
        run: |
          set -euo pipefail
          cf() { curl -sS "$@" -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json'; }
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          for app in client-web back-office; do
            for env in staging kvitka-uat wisla-uat; do
              project="$app-$env"
              if [ -n "$RECREATE" ]; then
                if cf "$base/$project/domains" | jq -e --arg h "$RECREATE" '.result[]? | select(.name == $h)' > /dev/null; then
                  cf -X DELETE "$base/$project/domains/$RECREATE" | jq -c '{success, errors}'
                  # Re-create the DNS record too, then give it time before Pages checks it again.
                  zone_id="$(cf "https://api.cloudflare.com/client/v4/zones?name=shatori.com" | jq -r '.result[0].id')"
                  records="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
                  for rid in $(cf "$records?name=$RECREATE" | jq -r '.result[].id'); do
                    cf -X DELETE "$records/$rid" | jq -c '{success}'
                  done
                  sleep 10
                  target="$(cf "$base/$project" | jq -r '.result.subdomain')"
                  cf -X POST "$records" -d "$(jq -nc --arg n "$RECREATE" --arg c "$target" --argjson p "$PROXIED" \
                    '{type:"CNAME", name:$n, content:$c, proxied:$p, ttl:1, comment:"Cloudflare Pages (internship CD)"}')" | jq -c '{success, errors}'
                  sleep 60
                  cf -X POST "$base/$project/domains" -d "$(jq -nc --arg n "$RECREATE" '{name:$n}')" | jq -c '{success, errors}'
                  echo "Re-created $RECREATE on $project"
                fi
              fi
              cf "$base/$project/domains" | jq -c --arg p "$project" --arg s "$(cf "$base/$project" | jq -r '.result.subdomain')" '.result[]? |
                {project: $p, subdomain: $s, name, status, verification: .verification_data, validation: (.validation_data | {status, method, error_message})}'
            done
          done

      - name: Show DNS records of the frontend hosts
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cf() { curl -sS "$@" -H "Authorization: Bearer $CF_TOKEN"; }
          zone_id="$(cf "https://api.cloudflare.com/client/v4/zones?name=shatori.com" | jq -r '.result[0].id')"
          for env in staging kvitka-uat wisla-uat; do
            for host in "$env.wallet.shatori.com" "$env-admin.wallet.shatori.com"; do
              cf "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$host" |
                jq -c --arg h "$host" '{host: $h, records: [.result[] | {type, content, proxied}]}'
            done
          done
