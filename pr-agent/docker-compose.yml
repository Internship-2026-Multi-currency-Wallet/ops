# AI review of pull requests in every repository of the organization: PR-Agent (https://github.com/The-PR-Agent/pr-agent)
# running as a GitHub App webhook server, model gpt-6.1-sol through the OpenAI API (billed to the API account).
# Deployed as the Dokploy Compose service "pr-agent" (project "Internship 2026", environment "shared").
# Source: this file in GitHub (ops, main). A push that changes pr-agent/** redeploys it automatically,
# so never edit the compose in the Dokploy UI. Secrets (PR_AGENT_*) live in the Dokploy Environment.
#
# - Webhook: https://pr-agent.wallet.shatori.com/api/v1/github_webhooks (Dokploy domain → service pr-agent, port 3000).
#   GET / returns {"status":"ok"}.
# - When it runs: PR opened / reopened / ready for review → /describe + /review; every push to the PR branch
#   (GitHub "synchronize") → /review. Draft PRs are skipped. Anyone can also comment /review, /describe,
#   /improve or /ask "<question>" on a PR.
# - These settings apply to all repositories. A repository can override them in a `.pr_agent.toml` at its root.

services:
  pr-agent:
    image: pragent/pr-agent:0.49.0-github_app
    restart: unless-stopped
    # The GitHub App private key is multi-line, so it is stored base64-encoded in one env var and decoded here.
    entrypoint:
      - sh
      - -c
      - |
        GITHUB__PRIVATE_KEY="$$(printf '%s' "$$PR_AGENT_GITHUB_PRIVATE_KEY_B64" | base64 -d)" || exit 1
        export GITHUB__PRIVATE_KEY
        unset PR_AGENT_GITHUB_PRIVATE_KEY_B64
        exec python -m gunicorn -k uvicorn.workers.UvicornWorker -c pr_agent/servers/gunicorn_config.py \
          --forwarded-allow-ips '*' pr_agent.servers.github_app:app
    environment:
      # Secrets (Dokploy → Internship 2026 → shared → pr-agent → Environment).
      GITHUB__APP_ID: ${PR_AGENT_GITHUB_APP_ID:?set PR_AGENT_GITHUB_APP_ID in the Dokploy environment}
      GITHUB__WEBHOOK_SECRET: ${PR_AGENT_GITHUB_WEBHOOK_SECRET:?set PR_AGENT_GITHUB_WEBHOOK_SECRET in the Dokploy environment}
      PR_AGENT_GITHUB_PRIVATE_KEY_B64: ${PR_AGENT_GITHUB_PRIVATE_KEY_B64:?set PR_AGENT_GITHUB_PRIVATE_KEY_B64 in the Dokploy environment}
      OPENAI__KEY: ${PR_AGENT_OPENAI_KEY:?set PR_AGENT_OPENAI_KEY in the Dokploy environment}
      # Model.
      CONFIG__MODEL: gpt-6.1-sol
      CONFIG__REASONING_EFFORT: medium
      # Triggers. Values are parsed as TOML.
      GITHUB_APP__HANDLE_PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
      GITHUB_APP__PR_COMMANDS: '["/describe", "/review"]'
      GITHUB_APP__HANDLE_PUSH_TRIGGER: 'true'
      GITHUB_APP__PUSH_COMMANDS: '["/review"]'
      GITHUB_APP__FEEDBACK_ON_DRAFT_PR: 'false'
      # Review. One comment per PR, updated on every push instead of a new one each time.
      PR_REVIEWER__PERSISTENT_COMMENT: 'true'
      PR_REVIEWER__NUM_MAX_FINDINGS: '7'
      PR_REVIEWER__REQUIRE_TESTS_REVIEW: 'true'
      PR_REVIEWER__REQUIRE_SECURITY_REVIEW: 'true'
      # Appended to PR-Agent's built-in review prompt. Keep '=' out of it: env values are parsed as TOML first.
      PR_REVIEWER__EXTRA_INSTRUCTIONS: |
        You are a senior engineer doing a CRITICAL review of a pull request written by an intern. Be skeptical and
        specific: your job is to find problems, not to praise. Silence on a file means you found nothing wrong in it.

        Project: a white-label multi-currency wallet. Backends wallet-core, rates-service, treasury-service are
        NestJS + GraphQL on MySQL and Redis (pub/sub, Streams, BullMQ); frontends client-web and back-office are React.
        Money is stored as integers in minor units, never floating point. Balances are derived from the ledger,
        never edited directly. If losing a message would lose money or break reporting, it must go through a
        Redis Stream, not pub/sub.

        Trust nothing. Read the actual code in the diff, not just the PR title and description, and check whether
        the description matches what the diff really does. Point out any mismatch: a claimed fix that does not fix
        the stated problem, a change the description does not mention, or a requirement it says is done but is not.

        Stress-test these risks:
        - edge cases and error paths: empty, null, zero, negative, very large values, rounding, currency precision,
          timezones, duplicates and retries;
        - money correctness: floats, lost precision, a ledger entry without its counterpart, a balance changed outside
          a transaction;
        - concurrency: races, double spending, idempotency of webhooks, jobs and message consumers, transaction
          boundaries and isolation;
        - database: query semantics, missing or useless indexes, N+1 queries, irreversible or unsafe migrations;
        - security: authorization checks on every GraphQL resolver, injection, secrets or personal data in code,
          logs or errors, trusting client input;
        - design: whether the abstraction and the module boundary are right, responsibilities that belong to another
          service, breaking changes to a GraphQL or event contract other services or frontends rely on;
        - tests: new logic without tests, tests that cannot fail, mocks that hide the real behaviour;
        - repository conventions from AGENTS.md, README and the handbook.

        Comment discipline: flag every comment in the diff that narrates what the code does, restates a condition
        legible beside it, repeats a name or signature, or runs longer than one load-bearing sentence. A comment may
        exist only for a non-obvious why (a constraint, invariant, race, trade-off, rejected alternative, or a
        surprising fact about another API). Propose the deletion or the one-sentence replacement.

        For every finding give a severity (blocker, major, minor or nit), what is wrong, why it matters, and a
        concrete fix. The author is learning: explain the reason so they can avoid the class of problem next time,
        not only this instance. Do not comment on formatting the linter already enforces. End with a one-line verdict
        on whether the PR is safe to merge.
      # The app code (~230 MB) is loaded once and shared by both workers.
      GUNICORN_WORKERS: '2'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640M
